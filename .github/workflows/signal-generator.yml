name: Signal Generator

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes so signals continue while your PC is off.
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal generator + learning review
        env:
          SIGNAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SIGNAL_TELEGRAM_BOT_TOKEN }}
          SIGNAL_TELEGRAM_CHAT_ID: ${{ secrets.SIGNAL_TELEGRAM_CHAT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SIGNAL_TIMEZONE: ${{ secrets.SIGNAL_TIMEZONE }}
        run: |
          TZ_NAME="${SIGNAL_TIMEZONE:-UTC}"
          python signal_generator.py \
            --eod-review \
            --telegram \
            --crypto-source binance \
            --metals-source fmp \
            --adaptive-confidence \
            --target-precision 0.90 \
            --other-max-confidence 0.98 \
            --timezone "$TZ_NAME"

      - name: Commit updated learning artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_journal.csv learning_state.json daily_signals.csv daily_signals_demo.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update signal journal and learning state"
          git push
